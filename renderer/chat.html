<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --radius: 20px;
      --accent: #007aff;
      --bg: rgba(255,255,255,0.95);
      --bg-msg: #f0f0f0;
      --bg-area: rgba(245,245,247,0.6);
      --text: #1d1d1f;
      --text-sub: #8e8e93;
      --border: rgba(0,0,0,0.08);
      --input-bg: rgba(0,0,0,0.04);
      --input-border: rgba(0,0,0,0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: rgba(30,30,30,0.95);
        --bg-msg: rgba(255,255,255,0.08);
        --bg-area: rgba(44,44,46,0.6);
        --text: #f5f5f7;
        --text-sub: #98989d;
        --border: rgba(255,255,255,0.1);
        --input-bg: rgba(255,255,255,0.06);
        --input-border: rgba(255,255,255,0.12);
      }
    }

    html, body {
      height: 100%;
      margin: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-radius: var(--radius);
      border: 0.5px solid var(--border);
      box-shadow:
        0 0 0 0.5px rgba(0, 0, 0, 0.04),
        0 8px 40px rgba(0, 0, 0, 0.12),
        0 2px 8px rgba(0, 0, 0, 0.06);
    }

    #chat-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    /* 카드형 헤더 — 에이전트별 그라데이션 */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      flex-shrink: 0;
      -webkit-app-region: drag;
      border-radius: var(--radius) var(--radius) 0 0;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .btn-close {
      width: 28px; height: 28px;
      border-radius: 50%; border: none;
      background: rgba(255,255,255,0.25);
      color: white;
      font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-app-region: no-drag;
      transition: all 0.2s;
    }
    .btn-close:hover { background: rgba(255,255,255,0.4); }

    .header-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .header-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      object-fit: cover; background: rgba(255,255,255,0.2);
      flex-shrink: 0; border: 2px solid rgba(255,255,255,0.4);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .header-text { display: flex; flex-direction: column; min-width: 0; }
    .header-name { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white; }
    .header-role {
      font-size: 12px; color: rgba(255,255,255,0.8);
      white-space: nowrap;
    }

    /* 메시지 영역 — 밝은 배경 */
    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg-area);
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-wrap: break-word;
      white-space: pre-wrap;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #007aff, #5856d6);
      color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 122, 255, 0.2);
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--bg-msg);
      color: var(--text);
      border: none;
      border-bottom-left-radius: 6px;
    }

    .message.error {
      color: #ff3b30;
      background: rgba(255, 59, 48, 0.08);
    }

    .message.loading { color: var(--text-sub); }

    .typing-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    .message a, .message .ext-link {
      color: #007aff;
      text-decoration: none;
      cursor: pointer;
    }
    .message a:hover, .message .ext-link:hover { text-decoration: underline; }

    /* 입력 영역 */
    .input-area {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 14px;
      border-top: 0.5px solid var(--border);
      flex-shrink: 0;
      background: var(--bg);
    }

    #input {
      flex: 1;
      padding: 9px 14px;
      border-radius: 18px;
      border: 0.5px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      line-height: 1.4;
      resize: none;
      max-height: 100px;
      transition: all 0.2s;
    }
    #input:focus { border-color: rgba(0, 122, 255, 0.4); background: rgba(0, 0, 0, 0.02); }
    #input::placeholder { color: var(--text-sub); }

    .btn-send {
      width: 32px; height: 32px;
      border-radius: 50%; border: none;
      background: #007aff;
      color: white; font-size: 16px; font-weight: 700;
      cursor: pointer; flex-shrink: 0;
      transition: all 0.15s;
    }
    .btn-send:hover { background: #0066d6; }
    .btn-send:active { transform: scale(0.9); }
    .btn-send:disabled { background: #c7c7cc; cursor: not-allowed; }

    /* 설정 */
    .settings-view {
      display: flex; flex-direction: column;
      align-items: center;
      flex: 1; padding: 30px; gap: 14px;
      background: var(--bg-area);
      overflow-y: auto;
    }
    .settings-view h2 { font-size: 18px; font-weight: 600; color: #333; }
    .settings-view p { color: #6b7280; font-size: 12px; text-align: center; }
    .settings-view input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1px solid #d1d5db; background: white;
      color: #333; font-size: 14px; outline: none;
    }
    .settings-view input:focus { border-color: var(--accent); }
    .btn-settings-close {
      background: #e5e7eb; color: #6b7280;
      border: none; padding: 10px; border-radius: 10px; width: 100%;
      cursor: pointer; font-size: 13px; margin-top: 4px;
    }
    .btn-settings-close:hover { background: #d1d5db; }

    .hidden { display: none !important; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <div class="container">
    <div id="chat-view">
      <div class="chat-header">
        <div class="header-info">
          <img class="header-avatar" id="avatar" src="">
          <div class="header-text">
            <span class="header-name" id="name"></span>
            <span class="header-role" id="role"></span>
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;-webkit-app-region:no-drag;">
          <button class="btn-agent-settings" id="agent-settings-btn" title="캐릭터 설정" style="
            width:28px;height:28px;border-radius:50%;border:none;
            background:rgba(255,255,255,0.25);color:white;
            font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
            -webkit-app-region:no-drag;transition:all 0.2s;
          ">⚙</button>
          <button class="btn-close" id="close-btn">✕</button>
        </div>
      </div>

      <!-- 캐릭터 설정 패널 -->
      <div id="agent-config" class="hidden" style="
        padding:14px 16px;border-bottom:1px solid var(--border);
        background:rgba(255,255,255,0.03);flex-shrink:0;
        display:flex;flex-direction:column;gap:8px;
      ">
        <div style="font-size:12px;font-weight:600;color:var(--text-secondary);">캐릭터 설정</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <img id="config-avatar" style="width:44px;height:44px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,0.06);cursor:pointer;" title="클릭하여 이미지 변경">
          <button id="config-img-btn" style="
            padding:6px 12px;border-radius:8px;border:1px solid var(--border);
            background:transparent;color:var(--text-secondary);font-size:11px;cursor:pointer;
          ">이미지 변경</button>
        </div>
        <input id="config-name" placeholder="이름 (예: 벨루가)" style="
          padding:8px 12px;border-radius:8px;border:1px solid var(--border);
          background:rgba(255,255,255,0.04);color:var(--text);font-size:13px;outline:none;
        ">
        <textarea id="config-role" placeholder="이 캐릭터가 할 일을 적어주세요.&#10;예: 아재개그 전문가. 말장난과 동음이의어 유머를 들려줘.&#10;예: 매일 운동 루틴을 짜줘. 근력 운동 위주로." rows="3" style="
          padding:8px 12px;border-radius:8px;border:1px solid var(--border);
          background:rgba(255,255,255,0.04);color:var(--text);font-size:13px;outline:none;
          resize:none;font-family:inherit;line-height:1.4;
        "></textarea>
        <div style="display:flex;gap:6px;">
          <button id="config-save" style="
            flex:1;padding:8px;border-radius:8px;border:none;
            background:linear-gradient(135deg,#4a6cf7,var(--accent));
            color:white;font-size:12px;font-weight:600;cursor:pointer;
          ">저장</button>
          <button id="config-reset" style="
            padding:8px 12px;border-radius:8px;border:1px solid var(--border);
            background:transparent;color:var(--text-secondary);font-size:12px;cursor:pointer;
          ">초기화</button>
        </div>
        <button id="config-clear-history" style="
          margin-top:4px;padding:8px;border-radius:8px;border:1px solid rgba(239,68,68,0.3);
          background:transparent;color:#f87171;font-size:11px;cursor:pointer;width:100%;
        ">대화 내용 리셋</button>
      </div>

      <div class="messages" id="messages"></div>
      <div class="input-area">
        <textarea id="input" placeholder="메시지를 입력하세요..." rows="1"></textarea>
        <button class="btn-send" id="send-btn">↑</button>
      </div>
    </div>

    <div id="settings-view" class="settings-view hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:4px;">
        <h2 style="font-size:16px;font-weight:600;color:#1d1d1f;">설정</h2>
        <button class="btn-settings-close" id="settings-close" style="width:auto;padding:6px 14px;border-radius:8px;font-size:12px;">닫기</button>
      </div>
      <div id="model-status" style="font-size:12px;min-height:16px;text-align:left;width:100%;margin-bottom:4px;"></div>
      <div style="width:100%;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:4px;">캐릭터 크기</div>
      <div style="width:100%;display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <input type="range" id="char-size" min="80" max="160" value="100" style="flex:1;accent-color:var(--accent);">
        <span id="char-size-label" style="font-size:12px;color:#6b7280;min-width:36px;">100%</span>
      </div>
      <div style="width:100%;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:4px;">바 위치</div>
      <div style="width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px;" id="position-grid">
        <button class="pos-btn" data-pos="top" style="padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:12px;">위</button>
        <button class="pos-btn" data-pos="bottom" style="padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:12px;">아래</button>
        <button class="pos-btn" data-pos="left" style="padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:12px;">왼쪽 (세로)</button>
        <button class="pos-btn" data-pos="right" style="padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:12px;">오른쪽 (세로)</button>
      </div>
      <div style="width:100%;font-size:12px;font-weight:600;color:#6b7280;margin-top:12px;margin-bottom:4px;">포모도로</div>
      <div style="width:100%;display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <input type="range" id="pomodoro-time" min="5" max="60" step="5" value="25" style="flex:1;accent-color:var(--accent);">
        <span id="pomodoro-label" style="font-size:12px;color:#6b7280;min-width:36px;">25분</span>
      </div>
      <button id="pomodoro-start" style="width:100%;padding:8px;border-radius:8px;border:none;background:var(--accent);color:white;font-size:12px;font-weight:600;cursor:pointer;">포모도로 시작</button>
      <button id="pomodoro-stop" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-sub);font-size:12px;cursor:pointer;margin-top:4px;display:none;">포모도로 중지</button>


      <div style="width:100%;margin-top:12px;padding:12px;border-radius:12px;background:rgba(0,0,0,0.03);font-size:11px;color:#8e8e93;line-height:1.6;">
        <div style="font-weight:600;color:#6b7280;margin-bottom:4px;">레벨업 규칙</div>
        대화 1회 = XP 1 획득<br>
        Lv.1: 0XP | Lv.2: 10XP | Lv.3: 25XP<br>
        Lv.4: 50XP | Lv.5: 100XP<br>
        매일 대화하면 연속일수(streak) 증가!<br>
        레벨이 오르면 캐릭터 이미지가 바뀝니다.
      </div>
    </div>
  </div>

  <script>
    const agentsInfo = {
      capybara: { name: '카피바라', role: '실시간핫이슈' },
      panda:    { name: '푸바오', role: '점심메뉴추천' },
      cat:      { name: '고양이', role: '플레이리스트' },
      monkey:   { name: '펀치', role: '용기충전' },
      nureong:  { name: '벨루가', role: '스마트학습' },
    };

    function getAgentImg(agentId, level) {
      return `../assets/${agentId}-lv${level || 1}.png`;
    }
    async function getAgentImgAsync(agentId, level) {
      const url = await window.api.getAgentImagePath(agentId, level || 1);
      return url || getAgentImg(agentId, level);
    }

    const agentGradients = {
      capybara: 'linear-gradient(135deg, #10b981, #059669)',
      panda:    'linear-gradient(135deg, #3b82f6, #2563eb)',
      cat:      'linear-gradient(135deg, #8b5cf6, #7c3aed)',
      monkey:   'linear-gradient(135deg, #f59e0b, #d97706)',
      nureong:  'linear-gradient(135deg, #ec4899, #db2777)',
    };

    const agentColors = {
      panda:    'rgba(74, 108, 247, 0.15)',
      monkey:   'rgba(245, 158, 11, 0.15)',
      cat:      'rgba(168, 85, 247, 0.15)',
      capybara: 'rgba(16, 185, 129, 0.15)',
      nureong:  'rgba(234, 179, 8, 0.15)',
    };

    const greetings = {
      capybara: '안녕~ 나는 카피바라야 🔥 지금 최신 트렌드 알려줄까?',
      panda: '안녕! 나는 푸바오야 🍱 오늘 점심 뭐 먹을지 고민이야? 기분이나 상황 알려주면 딱 맞는 식당 추천해줄게!',
      cat: '안녕! 나는 고양이야 🎵 오늘은 어떤 하루야? 분위기를 알려주면 딱 맞는 플레이리스트를 만들어줄게!',
      monkey: '안녕~ 나는 펀치야 🐵 오늘 하루는 어땠어? 기분이 어떤지 편하게 얘기해줘.',
      nureong: '안녕~ 나는 벨루가야 🐋 오늘 뭘 배울까?\n1) 오늘의 영단어\n2) AI 베스트셀러 추천\n3) 최신 AI 뉴스\n4) 퀴즈',
    };

    let currentAgent = null;
    let history = [];
    let isSending = false;

    const $ = (sel) => document.querySelector(sel);

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function linkify(text) {
      const escaped = escapeHtml(text);
      // Match URLs, then decode &amp; back to & for data-url
      return escaped.replace(
        /(https?:\/\/[^\s<]+)/g,
        (match) => {
          const decoded = match.replace(/&amp;/g, '&');
          return `<a href="#" class="ext-link" data-url="${decoded}">${match}</a>`;
        }
      );
    }

    function renderMessages() {
      const container = $('#messages');
      container.innerHTML = history
        .map(m => {
          let cls = m.role;
          if (m.error) cls += ' error';
          if (m.loading) cls += ' loading';
          const content = m.loading
            ? `<span>${escapeHtml(m.content)}</span><span class="typing-dots"></span>`
            : linkify(m.content);
          return `<div class="message ${cls}">${content}</div>`;
        })
        .join('');

      // Scroll to bottom smoothly
      requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
      });
    }

    async function initChat(agentId) {
      if (agentId === 'settings') {
        $('#chat-view').classList.add('hidden');
        $('#settings-view').classList.remove('hidden');

        const [status, barPos, pinned] = await Promise.all([
          window.api.getLlmStatus(),
          window.api.getBarPosition(),
          window.api.getBarPinned(),
        ]);
        // updatePinUI 제거됨 (항상표시 삭제)
        if (status.ready) {
          $('#model-status').textContent = 'AI 정상 작동 중';
          $('#model-status').style.color = '#10b981';
        } else {
          $('#model-status').textContent = 'AI 연결 안 됨';
          $('#model-status').style.color = '#f87171';
        }
        // 현재 위치 하이라이트
        document.querySelectorAll('.pos-btn').forEach(b => {
          if (b.dataset.pos === barPos) {
            b.style.background = 'var(--accent)';
            b.style.color = 'white';
            b.style.borderColor = 'var(--accent)';
          }
        });
        return;
      }

      currentAgent = agentId;
      const info = agentsInfo[agentId];
      if (!info) return;

      const [affinity, custom] = await Promise.all([
        window.api.getAffinity(agentId),
        window.api.getAgentCustom(agentId),
      ]);
      $('#avatar').src = await getAgentImgAsync(agentId, affinity.level);
      $('#avatar').style.background = agentColors[agentId] || 'rgba(255,255,255,0.06)';
      $('#name').textContent = custom?.name || info.name;
      const moodEmoji = { happy:'😊', content:'🙂', bored:'😐', lonely:'🥺', sleepy:'😴', curious:'🤔' };
      $('#role').textContent = `${info.role} | Lv.${affinity.level} ${moodEmoji[affinity.mood] || ''}`;
      // 헤더 그라데이션 적용
      document.querySelector('.chat-header').style.background = agentGradients[agentId] || 'linear-gradient(135deg, #6366f1, #4f46e5)';
      $('#agent-config').classList.add('hidden');

      // Load today's history, or start fresh
      const saved = await window.api.loadHistory(agentId);
      if (saved && saved.length > 0) {
        history = saved;
      } else {
        history = [{ role: 'assistant', content: greetings[agentId] }];
        // greeting을 store에 저장하여 창 닫아도 유지
        window.api.saveHistory(agentId, history);
      }
      renderMessages();

      $('#chat-view').classList.remove('hidden');
      $('#settings-view').classList.add('hidden');

      setTimeout(async () => {
        $('#input').focus();
        // 이전에 닫혀서 못 받은 응답이 있으면 폴링
        const pending = await window.api.getPendingChat(currentAgent);
        if (pending && pending.status === 'loading') {
          // 아직 응답 대기 중 — 로딩 표시 + 폴링
          const agentName = $('#name').textContent;
          history.push({ role: 'assistant', content: `${agentName} 생각 중`, loading: true });
          renderMessages();
          isSending = true;
          $('#send-btn').disabled = true;
          startPolling();
        } else if (pending && pending.status === 'done') {
          // 응답 완료 — 히스토리 리로드
          await refreshFromStore();
        }
      }, 150);
    }

    // Read agent from URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const agentFromUrl = urlParams.get('agent');
    if (agentFromUrl) {
      initChat(agentFromUrl);
    }

    // Close — mousedown 사용 (drag 영역 내 no-drag 버튼 클릭 문제 해결)
    $('#close-btn').addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      window.api.closeChat();
    });

    // 핀(고정) 토글

    // 바 위치 설정
    document.querySelectorAll('.pos-btn').forEach(btn => {
      btn.addEventListener('mousedown', async (e) => {
        e.preventDefault();
        const pos = btn.dataset.pos;
        await window.api.setBarPosition(pos);
        // 선택된 버튼 하이라이트
        document.querySelectorAll('.pos-btn').forEach(b => {
          b.style.background = 'transparent';
          b.style.color = 'var(--text-secondary)';
          b.style.borderColor = 'var(--border)';
        });
        btn.style.background = 'var(--accent)';
        btn.style.color = 'white';
        btn.style.borderColor = 'var(--accent)';
      });
    });

    // 캐릭터 크기 슬라이더
    const charSlider = $('#char-size');
    const charLabel = $('#char-size-label');
    if (charSlider) {
      window.api.getCharSize().then(s => { charSlider.value = s; charLabel.textContent = s + '%'; });
      charSlider.addEventListener('input', () => {
        charLabel.textContent = charSlider.value + '%';
        window.api.setCharSize(parseInt(charSlider.value));
      });
    }

    // 포모도로
    const pomSlider = $('#pomodoro-time');
    const pomLabel = $('#pomodoro-label');
    const pomStart = $('#pomodoro-start');
    const pomStop = $('#pomodoro-stop');
    if (pomSlider) {
      pomSlider.addEventListener('input', () => {
        pomLabel.textContent = pomSlider.value + '분';
      });
      pomStart.addEventListener('click', async () => {
        await window.api.startPomodoro(parseInt(pomSlider.value));
        pomStart.style.display = 'none';
        pomStop.style.display = 'block';
      });
      pomStop.addEventListener('click', async () => {
        await window.api.stopPomodoro();
        pomStop.style.display = 'none';
        pomStart.style.display = 'block';
      });
    }

    $('#settings-close').addEventListener('mousedown', (e) => {
      e.preventDefault();
      window.api.closeChat();
    });

    // 캐릭터 설정 패널
    $('#agent-settings-btn').addEventListener('mousedown', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!currentAgent) return;
      const panel = $('#agent-config');
      if (!panel.classList.contains('hidden')) {
        panel.classList.add('hidden');
        return;
      }
      const [custom, affinity, defaultRole] = await Promise.all([
        window.api.getAgentCustom(currentAgent),
        window.api.getAffinity(currentAgent),
        window.api.getDefaultRole(currentAgent),
      ]);
      const defaults = agentsInfo[currentAgent];
      $('#config-name').value = custom?.name || defaults.name;
      $('#config-role').value = custom?.role || defaultRole;
      $('#config-avatar').src = await getAgentImgAsync(currentAgent, affinity.level);
      panel.classList.remove('hidden');
    });

    // 이미지 변경
    // 흰 배경 투명 처리 (flood fill, 가장자리에서 시작)
    function removeWhiteBackground(imgEl) {
      const canvas = document.createElement('canvas');
      canvas.width = imgEl.naturalWidth;
      canvas.height = imgEl.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(imgEl, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imgData.data;
      const w = canvas.width, h = canvas.height;
      const isWhite = (i) => d[i] > 240 && d[i+1] > 240 && d[i+2] > 240;
      const visited = new Uint8Array(w * h);
      const stack = [];
      // 가장자리에서 시작
      for (let x = 0; x < w; x++) { stack.push(x, 0); stack.push(x, h-1); }
      for (let y = 0; y < h; y++) { stack.push(0, y); stack.push(w-1, y); }
      while (stack.length) {
        const y = stack.pop(), x = stack.pop();
        if (x < 0 || x >= w || y < 0 || y >= h) continue;
        const idx = y * w + x;
        if (visited[idx]) continue;
        visited[idx] = 1;
        const i = idx * 4;
        if (isWhite(i)) {
          d[i+3] = 0;
          stack.push(x-1, y); stack.push(x+1, y);
          stack.push(x, y-1); stack.push(x, y+1);
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas.toDataURL('image/png');
    }

    const pickImage = async () => {
      const result = await window.api.pickAgentImage(currentAgent);
      if (result?.dataUrl) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = async () => {
          const dataUrl = removeWhiteBackground(img);
          await window.api.saveAgentImage(currentAgent, dataUrl);
          const ts = Date.now();
          const affinity = await window.api.getAffinity(currentAgent);
          const newSrc = await getAgentImgAsync(currentAgent, affinity.level) + '&t=' + ts;
          $('#config-avatar').src = newSrc;
          $('#avatar').src = newSrc;
        };
        img.src = result.dataUrl;
      }
    };
    $('#config-img-btn').addEventListener('click', pickImage);
    $('#config-avatar').addEventListener('click', pickImage);

    $('#config-save').addEventListener('click', async () => {
      const name = $('#config-name').value.trim();
      const role = $('#config-role').value.trim();
      if (!name) return;
      await window.api.setAgentCustom({ agentId: currentAgent, name, role });
      $('#name').textContent = name;
      const affinity = await window.api.getAffinity(currentAgent);
      $('#role').textContent = `${role.slice(0, 20)} | Lv.${affinity.level}`;
      // 대화 내역 자동 리셋
      const greeting = `안녕! 나는 ${name}이야. 새로운 역할로 바꿨어! 뭐든 물어봐.`;
      history = [{ role: 'assistant', content: greeting }];
      await window.api.saveHistory(currentAgent, history);
      renderMessages();
      $('#agent-config').classList.add('hidden');
    });

    $('#config-clear-history').addEventListener('click', async () => {
      if (!currentAgent) return;
      const greeting = greetings[currentAgent] || '안녕!';
      history = [{ role: 'assistant', content: greeting }];
      await window.api.saveHistory(currentAgent, history);
      renderMessages();
      $('#agent-config').classList.add('hidden');
    });

    $('#config-reset').addEventListener('click', async () => {
      await window.api.resetAgentCustom(currentAgent);
      await window.api.resetAgentImage(currentAgent);
      const defaults = agentsInfo[currentAgent];
      const [affinity, defaultRole] = await Promise.all([
        window.api.getAffinity(currentAgent),
        window.api.getDefaultRole(currentAgent),
      ]);
      $('#name').textContent = defaults.name;
      $('#role').textContent = `${defaults.role} | Lv.${affinity.level}`;
      $('#config-name').value = defaults.name;
      $('#config-role').value = defaultRole;
      // 이미지도 원본으로 복원
      $('#avatar').src = `../assets/${currentAgent}-lv${affinity.level}.png?t=${Date.now()}`;
      $('#config-avatar').src = `../assets/${currentAgent}-lv${affinity.level}.png?t=${Date.now()}`;
      $('#agent-config').classList.add('hidden');
    });

    // 응답 폴링 타이머
    let pollTimer = null;

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    async function refreshFromStore() {
      if (!currentAgent) return false;
      const latest = await window.api.loadHistory(currentAgent);
      if (!latest) return false;

      // 새 assistant 응답이 있는지 확인
      const lastMsg = latest[latest.length - 1];
      const hadLoading = history.some(m => m.loading);
      if (hadLoading && lastMsg && lastMsg.role === 'assistant') {
        history = latest;
        renderMessages();

        const [aff, cust] = await Promise.all([
          window.api.getAffinity(currentAgent),
          window.api.getAgentCustom(currentAgent),
        ]);
        $('#avatar').src = await getAgentImgAsync(currentAgent, aff.level);
        $('#role').textContent = `${agentsInfo[currentAgent].role} | Lv.${aff.level}`;

        isSending = false;
        $('#send-btn').disabled = false;
        $('#input').focus();
        stopPolling();
        return true;
      }
      return false;
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(() => refreshFromStore(), 1500);
    }

    // Send message
    async function sendMessage() {
      const text = $('#input').value.trim();
      if (!text || !currentAgent || isSending) return;

      isSending = true;
      $('#send-btn').disabled = true;
      // 한글 IME 조합 완전 해제 후 클리어
      const inp = $('#input');
      inp.blur();
      setTimeout(() => { inp.value = ''; inp.style.height = 'auto'; inp.focus(); }, 50);

      history.push({ role: 'user', content: text });
      renderMessages();

      const agentName = $('#name').textContent;
      history.push({ role: 'assistant', content: `${agentName} 생각 중`, loading: true });
      renderMessages();

      const apiMessages = history
        .filter(m => !m.loading)
        .slice(-20)
        .map(m => ({ role: m.role, content: m.content }));

      const result = await window.api.chat(currentAgent, apiMessages);

      if (result.status === 'error') {
        history = history.filter(m => !m.loading);
        history.push({ role: 'assistant', content: result.error, error: true });
        renderMessages();
        isSending = false;
        $('#send-btn').disabled = false;
        return;
      }

      // 백그라운드 처리 중 — 폴링 시작
      startPolling();
    }

    // 스트리밍: 마지막 로딩 메시지만 텍스트 교체 (전체 DOM 리렌더 방지)
    window.api.onChatStream((data) => {
      if (data.agent !== currentAgent) return;
      const loadingIdx = history.findIndex(m => m.loading);
      if (loadingIdx !== -1) {
        history[loadingIdx] = { role: 'assistant', content: data.partial, loading: true };
        // 전체 renderMessages() 대신 해당 메시지 엘리먼트만 업데이트
        const container = $('#messages');
        const msgEl = container.children[loadingIdx];
        if (msgEl) {
          msgEl.innerHTML = `<span>${escapeHtml(data.partial)}</span><span class="typing-dots"></span>`;
          container.scrollTop = container.scrollHeight;
        } else {
          renderMessages();
        }
      }
    });

    // 완료 시 히스토리 리로드
    window.api.onChatResponse(() => refreshFromStore());

    $('#send-btn').addEventListener('click', sendMessage);

    // Enter = 전송, Shift+Enter = 줄바꿈
    $('#input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) e.preventDefault();
    });
    $('#input').addEventListener('keyup', e => {
      if (e.key === 'Enter' && !e.shiftKey) sendMessage();
    });
    // Auto-resize textarea
    $('#input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });


    // Open links in external browser
    document.addEventListener('click', e => {
      const link = e.target.closest('.ext-link');
      if (link) {
        e.preventDefault();
        window.api.openExternal(link.dataset.url);
      }
    });

    // Escape to close
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') window.api.closeChat();
    });
  </script>
</body>
</html>
