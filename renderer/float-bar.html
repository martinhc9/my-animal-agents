<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Agents</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .bar {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      height: 100%;
    }

    .agent-btn {
      flex: 0 0 auto;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      -webkit-app-region: no-drag;
      position: relative;
      padding: 0;
      overflow: visible;
      width: 72px;
      height: 100%;
    }

    .agent-btn img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .agent-btn:hover img {
      transform: translateY(-10px) scale(1.12);
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
    }

    .agent-btn:active img {
      transform: translateY(-5px) scale(1.06);
    }


    /* 세로 모드 */
    body.vertical {
      align-items: stretch;
      justify-content: center;
    }
    body.vertical .bar {
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
      height: 100%;
      width: 100%;
    }
    body.vertical .agent-btn {
      flex: 0 0 auto;
      width: 100%;
      height: 72px;
      align-items: center;
      padding: 0;
    }
    body.vertical .agent-btn img {
      width: auto;
      height: 68px;
      max-width: 90%;
    }
    body.vertical .agent-btn:hover img {
      transform: translateX(-10px) scale(1.12);
    }
    body.vertical .settings-btn {
      margin-left: 0;
      margin-top: 0;
    }

    /* 설정 버튼 */
    .settings-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: no-drag;
      margin-left: 4px;
      margin-bottom: 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .settings-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: rotate(45deg) scale(1.1);
    }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <button class="settings-btn" title="설정">⚙️</button>
  </div>

  <script>
    const defaultAgentNames = {
      capybara: '카피바라 - 실시간핫이슈',
      panda: '푸바오 - 점심메뉴추천',
      cat: '고양이 - 플레이리스트',
      monkey: '펀치 - 용기충전',
      nureong: '벨루가 - 스마트학습',
    };

    async function buildBar() {
      const [order, affinities] = await Promise.all([
        window.api.getAgentsOrder(),
        window.api.getAllAffinities(),
      ]);

      const bar = document.getElementById('bar');
      const settingsBtn = bar.querySelector('.settings-btn');

      bar.querySelectorAll('.agent-btn').forEach(b => b.remove());

      const customs = await Promise.all(order.map(id => window.api.getAgentCustom(id)));
      const customMap = {};
      order.forEach((id, i) => { customMap[id] = customs[i]; });

      for (const agentId of order) {
        const level = affinities[agentId]?.level || 1;
        const custom = customMap[agentId];
        const displayName = custom?.name
          ? `${custom.name}`
          : (defaultAgentNames[agentId] || agentId).split(' - ')[0];

        const btn = document.createElement('button');
        btn.className = 'agent-btn';
        btn.dataset.agent = agentId;
        btn.draggable = false;
        let imgSrc = `../assets/${agentId}-lv${level}.png`;
        try {
          const imgUrl = await window.api.getAgentImagePath(agentId, level);
          if (imgUrl) imgSrc = imgUrl;
        } catch {}
        btn.innerHTML = `<img src="${imgSrc}" alt="${agentId}" onerror="this.src='../assets/${agentId}-lv${level}.png'">`;

        btn.addEventListener('click', () => {
          window.api.openAgent(agentId);
        });

        bar.insertBefore(btn, settingsBtn);
      }
    }

    document.querySelector('.settings-btn').addEventListener('click', () => {
      window.api.openSettings();
    });

    function applyCharSize(size) {
      const scale = size / 100;
      const isVert = document.body.classList.contains('vertical');
      if (isVert) {
        document.querySelectorAll('.agent-btn').forEach(btn => {
          btn.style.width = '100%';
          btn.style.height = Math.round(72 * scale) + 'px';
        });
        document.querySelectorAll('.agent-btn img').forEach(img => {
          img.style.height = Math.round(68 * scale) + 'px';
          img.style.width = 'auto';
        });
      } else {
        const px = Math.round(75 * scale);
        document.querySelectorAll('.agent-btn').forEach(btn => {
          btn.style.width = Math.round(80 * scale) + 'px';
          btn.style.height = '100%';
        });
        document.querySelectorAll('.agent-btn img').forEach(img => {
          img.style.width = px + 'px';
          img.style.height = px + 'px';
        });
      }
    }

    window.api.onCharSize(s => applyCharSize(s));

    async function refreshLayout() {
      const pos = await window.api.getBarPosition();
      document.body.classList.remove('vertical');
      if (pos === 'left' || pos === 'right') document.body.classList.add('vertical');
    }
    window.api.onBarLayout(() => refreshLayout());
    refreshLayout();

    // buildBar 완료 후 크기 적용
    buildBar().then(async () => {
      const size = await window.api.getCharSize();
      applyCharSize(size);
    });
  </script>
</body>
</html>
